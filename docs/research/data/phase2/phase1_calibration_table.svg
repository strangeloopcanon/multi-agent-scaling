<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200">
  <rect x="0" y="0" width="2200" height="1200" fill="#ffffff"/>

  <text x="70" y="80" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#111827">
    Phase I Calibration Results: p_success Signal and Token Calibration
  </text>
  <text x="70" y="130" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#333333">
    Brier Skill > 0 indicates better-than-base-rate calibration.
  </text>

  <!-- Table geometry -->
  <!-- x0=70, y0=200, widths: 420 | 530 | 430 | 680, row_h=95 -->
  <g id="table">
    <rect x="70" y="200" width="2060" height="95" fill="#f3f4f6"/>
    <rect x="70" y="390" width="2060" height="95" fill="#f9fafb"/>
    <rect x="70" y="580" width="2060" height="95" fill="#f9fafb"/>
    <rect x="70" y="770" width="2060" height="95" fill="#f9fafb"/>

    <!-- grid -->
    <g stroke="#d0d7de" stroke-width="2">
      <line x1="70" y1="200" x2="70" y2="865"/>
      <line x1="490" y1="200" x2="490" y2="865"/>
      <line x1="1020" y1="200" x2="1020" y2="865"/>
      <line x1="1450" y1="200" x2="1450" y2="865"/>
      <line x1="2130" y1="200" x2="2130" y2="865"/>

      <line x1="70" y1="200" x2="2130" y2="200"/>
      <line x1="70" y1="295" x2="2130" y2="295"/>
      <line x1="70" y1="390" x2="2130" y2="390"/>
      <line x1="70" y1="485" x2="2130" y2="485"/>
      <line x1="70" y1="580" x2="2130" y2="580"/>
      <line x1="70" y1="675" x2="2130" y2="675"/>
      <line x1="70" y1="770" x2="2130" y2="770"/>
      <line x1="70" y1="865" x2="2130" y2="865"/>
    </g>

    <!-- headers -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">
      <text x="86" y="257">Model</text>
      <text x="506" y="257">External Pass Rate (50-task slice)</text>
      <text x="1036" y="257">Brier Skill (93-task Phase I)</text>
      <text x="1466" y="257">Token Calibration (Est/Actual)</text>
    </g>

    <!-- rows -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827">
      <text x="86" y="352">GPT-5.2</text>
      <text x="506" y="352">74.0%</text>
      <text x="1036" y="352" fill="#7f1d1d">-0.268</text>
      <text x="1466" y="352">0.02 (global median est/actual)</text>

      <text x="86" y="447">GPT-5.2-pro</text>
      <text x="506" y="447">70.0%</text>
      <text x="1036" y="447" fill="#7f1d1d">-0.132</text>
      <text x="1466" y="447">0.02 (global median est/actual)</text>

      <text x="86" y="542">Gemini 3 Pro Preview</text>
      <text x="506" y="542">66.0%</text>
      <text x="1036" y="542" fill="#7f1d1d">-0.180</text>
      <text x="1466" y="542">0.02 (global median est/actual)</text>

      <text x="86" y="637">Claude Opus 4.5</text>
      <text x="506" y="637">66.0%</text>
      <text x="1036" y="637" fill="#065f46" font-weight="700">+0.002</text>
      <text x="1466" y="637">0.02 (global median est/actual)</text>

      <text x="86" y="732">Claude Sonnet 4.5</text>
      <text x="506" y="732">62.0%</text>
      <text x="1036" y="732" fill="#065f46" font-weight="700">+0.069</text>
      <text x="1466" y="732">0.02 (global median est/actual)</text>

      <text x="86" y="827">GPT-5-mini</text>
      <text x="506" y="827">60.0%</text>
      <text x="1036" y="827" fill="#7f1d1d">-0.162</text>
      <text x="1466" y="827">0.02 (global median est/actual)</text>
    </g>
  </g>

  <text x="70" y="980" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">
    Token calibration value shown is the published global median ratio (estimated/actual = 0.02), not per-model.
  </text>
  <text x="70" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">
    Sources: docs/research/report/01_PHASE_1_CALIBRATION.md and README.md
  </text>
</svg>
